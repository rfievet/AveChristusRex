<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ave Christus Rex</title>
    <!--
      GitHub Pages has no server-side routing, so a direct hit on a client-side
      route (e.g. /AveChristusRex/topic/objections) returns this 404 page.
      This script rewrites the path into a query string and redirects to the
      app root; index.html restores the real URL before React Router boots.
      Technique: https://github.com/rafgraph/spa-github-pages (MIT).
      pathSegmentsToKeep = 1 keeps the /AveChristusRex/ project-page base.
    -->
    <script>
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
